name: Deploy Firebase Hosting (mylapak)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['hosting/**', '.github/workflows/firebase-hosting-mylapak.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Deploy hosting mylapak only
        working-directory: hosting
        run: firebase deploy --only hosting:mylapak --project toko-mobile-app --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
